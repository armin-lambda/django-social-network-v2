{% if form.errors %}
    <div class="form-errors">
        {% for field in form %}
            {% for error in field.errors %}
                <div class="form-error">{{ error }}</div>
            {% endfor %}
        {% endfor %}

        {% for error in form.non_field_errors %}
            <div class="form-error">{{ error }}</div>
        {% endfor %}
    </div>
{% endif %}
